name: M3 winter playthrough

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/m3-playtest.yml"

permissions:
  contents: read

concurrency:
  group: m3-winter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        viewport: [390x844, 844x390, 820x1180, 375x667]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps "$PLAYTEST_ENGINES"
        env:
          PLAYTEST_ENGINES: ${{ matrix.engine }}
      - run: npm run build
      - name: Play a winter with standard and quiet settings
        env:
          PLAYTEST_ENGINES: ${{ matrix.engine }}
          PLAYTEST_VIEWPORTS: ${{ matrix.viewport }}
          PLAY_URL: http://127.0.0.1:3191
        run: |
          python3 -m http.server 3191 --bind 127.0.0.1 --directory out &
          trap 'kill "$!"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent "$PLAY_URL/play/" > /dev/null
          npm run playtest:p1
          if [[ "$PLAYTEST_VIEWPORTS" == "375x667" ]]; then
            PLAYTEST_ENGINE="$PLAYTEST_ENGINES" npm run playtest:accessibility
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-${{ matrix.engine }}-${{ matrix.viewport }}
          path: web/playtest-artifacts/p1/
