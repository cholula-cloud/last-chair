name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - web/src/**
              - web/public/**
              - web/app/**
              - web/scripts/**
              - .github/workflows/ci.yml

  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci:fast

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:ci:slow
      - run: npm run m2-gate
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out/
          retention-days: 1

  e2e-smoke:
    needs: [slow, paths]
    if: github.event_name == 'pull_request' && needs.paths.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            sleep $((attempt * 4))
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out/
      - name: Chromium smoke at 390×844
        env:
          PLAY_URL: http://127.0.0.1:3191
        run: |
          python3 -m http.server 3191 --bind 127.0.0.1 --directory out &
          trap 'kill "$!"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent "$PLAY_URL/play/" > /dev/null
          npm run playtest:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-screenshots
          path: web/playtest-artifacts/smoke/

  # Single required check for branch protection rules that still expect one gate.
  check:
    needs: [fast, slow]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: CI gates passed
        run: |
          test "${{ needs.fast.result }}" = "success"
          test "${{ needs.slow.result }}" = "success"